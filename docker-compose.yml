services:
  app:
    image: php:8.4-cli
    container_name: my-shop-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - shop-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel_shop
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel

  db:
    image: mysql:8.0
    container_name: my-shop-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_shop
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shop-network

volumes:
  db_data:

networks:
  shop-network:
    driver: bridge